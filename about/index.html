<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>このサイトについて — LocalTools</title><link rel="stylesheet" href="../assets/style.css"></head><body><header class="nav"><div class="wrap navin"><a class="brand" href="../">Local<span>Tools</span></a></div></header><main class="page"><div class="wrap prose"><h1>このサイトについて</h1><p>LocalToolsは、仕事で発生する小さな面倒を減らすための無料ブラウザツール集です。</p><h2>設計方針</h2><p>可能な処理は端末のブラウザ内で完結させ、利用者が扱うファイルや業務データをむやみに外部へ送信しないことを重視します。各ツールで通信が必要になる場合は、その旨を明示します。</p><h2>利用について</h2><p>各ツールは利用者自身の判断と責任で使用してください。重要なデータは必ず別途バックアップしてください。</p></div></main></body></html>
